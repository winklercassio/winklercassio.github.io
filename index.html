<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cássio Winkler — Analista de Sistemas, Suporte de TI em Guarapuava. Tecnologia, ERP TOTVS, projetos, sistemas e consultoria.">
  <meta name="keywords" content="Cássio Winkler, Analista de Sistemas, Suporte de TI em Guarapuava">
  <meta name="author" content="Cássio Winkler">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Cássio Winkler | Tecnologia, Sistemas e Consultoria">
  <meta property="og:description" content="Analista de Sistemas, Tech Lead e especialista em tecnologia, ERP e projetos de TI.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b0d10">
  <title>Cássio Winkler | Analista de Sistemas</title>

  <style>
    :root{
      --bg:#0b0d10; --panel:#11151a; --text:#f3f5f7; --muted:#9aa4af;
      --line:#252b33; --accent:#d7ff3f; --max:1120px; --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(calc(100% - 40px),var(--max));margin:auto}
    .hero{min-height:100vh;display:grid;align-items:center;padding:70px 0}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.75fr);gap:70px;align-items:center}
    .hero-copy{min-width:0}
    .hero-contact{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.18)}
    .hero-contact h2{font-size:clamp(1.8rem,3vw,2.6rem);margin:0 0 10px;line-height:1.05;letter-spacing:-.05em}
    .hero-contact .contact-intro{color:var(--muted);margin:0 0 24px}
    .hero-contact form{gap:12px}
    .hero-contact textarea{min-height:120px}
    .eyebrow{color:var(--accent);font-size:.82rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin-bottom:18px}
    h1{font-size:clamp(3rem,8vw,6.8rem);line-height:.92;letter-spacing:-.075em;max-width:900px;margin:0 0 28px}
    .lead{font-size:clamp(1.05rem,2vw,1.35rem);color:#c5cbd2;max-width:720px;margin:0 0 34px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line);font-weight:750;transition:.2s ease}
    .btn.primary{background:var(--accent);color:#0b0d10;border-color:var(--accent)}
    .btn:hover{transform:translateY(-2px)}
    form{display:grid;gap:13px}
    label{font-size:.86rem;color:#c8cdd3;font-weight:700}
    input,textarea{width:100%;border:1px solid var(--line);background:#0e1115;color:var(--text);border-radius:12px;padding:14px 15px;font:inherit;outline:none}
    input:focus,textarea:focus{border-color:#65707d;box-shadow:0 0 0 3px rgba(215,255,63,.08)}
    textarea{min-height:150px;resize:vertical}
    button{cursor:pointer;border:0}
    @media(max-width:800px){
      .navlinks{display:none}
      .hero-grid,.grid,.contact{grid-template-columns:1fr}
      .hero{min-height:auto;padding:70px 0}
      .hero-contact{padding:24px}
      .section-head{display:block}
      .section-intro{margin-top:16px}
      .job{grid-template-columns:1fr;gap:7px}
    }
    @media(max-width:520px){
      .wrap{width:min(calc(100% - 28px),var(--max))}
      h1{font-size:clamp(3rem,16vw,4.8rem)}
      .hero{padding:55px 0}
      .hero-contact{padding:20px}
    }

    /* Modal de feedback do formulário */
    .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
    .modal.is-open{opacity:1;visibility:visible;pointer-events:auto}
    .modal-content{position:relative;width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.45);transform:translateY(10px) scale(.98);transition:transform .2s ease}
    .modal.is-open .modal-content{transform:translateY(0) scale(1)}
    .modal-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#0b0d10;font-size:1.35rem;font-weight:900;margin-bottom:20px}
    .modal-content h3{margin:0 0 10px;font-size:1.5rem;letter-spacing:-.03em}
    .modal-content p{margin:0;color:var(--muted)}
    .modal-close{margin-top:26px;width:100%}
    .modal-close-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:1.25rem;display:flex;align-items:center;justify-content:center}
    .modal-close-x:hover,.modal-close-x:focus{color:var(--text);border-color:#65707d}
    body.modal-open{overflow:hidden}
    .form-status{color:var(--muted);font-size:.9rem;min-height:1.4em}

    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
  </style>
</head>

<body>


<main>
  <section class="hero" id="inicio">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <div class="eyebrow">Tecnologia · Sistemas · Negócios</div>
        <h1>Cássio<br>Winkler.</h1>
        <p class="lead">Analista de Sistemas, Tech Lead e especialista em tecnologia. Conecto negócio, pessoas e sistemas para transformar problemas em soluções práticas.</p>
        </div>

      <div class="hero-contact" id="contato">
        <div class="eyebrow">Contato</div>
         <form id="contact-form" action="https://formspree.io/f/mjyklevv" method="POST">
          <div><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required></div>
          <div><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div><label for="assunto">Assunto</label><input id="assunto" name="assunto" required></div>
          <div><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" required></textarea></div>
          <div class="form-status" id="form-status" aria-live="polite"></div>
          <button class="btn primary" id="submit-button" type="submit">Enviar mensagem</button>
        </form>
      </div>
    </div>
  </section>



  
</main>


  <div class="modal" id="contact-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
    <div class="modal-content">
      <button class="modal-close-x" id="modal-close-x" type="button" aria-label="Fechar mensagem">×</button>
      <div class="modal-icon" aria-hidden="true">✓</div>
      <h3 id="modal-title">Mensagem enviada!</h3>
      <p id="modal-message">Obrigado pelo contato. Em breve retorno para conversarmos.</p>
      <button class="btn primary modal-close" id="modal-close" type="button">Fechar</button>
    </div>
  </div>

  <script>
    (() => {
      const form = document.getElementById("contact-form");
      const modal = document.getElementById("contact-modal");
      const modalTitle = document.getElementById("modal-title");
      const modalMessage = document.getElementById("modal-message");
      const modalClose = document.getElementById("modal-close");
      const modalCloseX = document.getElementById("modal-close-x");
      const submitButton = document.getElementById("submit-button");
      const formStatus = document.getElementById("form-status");

      let lastFocusedElement = null;

      function openModal(title, message, isError = false) {
        lastFocusedElement = document.activeElement;
        modalTitle.textContent = title;
        modalMessage.textContent = message;

        const icon = modal.querySelector(".modal-icon");
        icon.textContent = isError ? "!" : "✓";

        modal.classList.add("is-open");
        document.body.classList.add("modal-open");
        modalClose.focus();
      }

      function closeModal() {
        modal.classList.remove("is-open");
        document.body.classList.remove("modal-open");

        if (lastFocusedElement) {
          lastFocusedElement.focus();
        }
      }

      modalClose.addEventListener("click", closeModal);
      modalCloseX.addEventListener("click", closeModal);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) {
          closeModal();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const originalButtonText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = "Enviando...";
        formStatus.textContent = "";

        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {
              "Accept": "application/json"
            }
          });

          if (!response.ok) {
            throw new Error("Falha ao enviar o formulário.");
          }

          form.reset();
          openModal(
            "Mensagem enviada!",
            "Obrigado pelo contato. Em breve retorno para conversarmos."
          );
        } catch (error) {
          openModal(
            "Não foi possível enviar",
            "Ocorreu um problema ao enviar sua mensagem. Tente novamente em alguns instantes.",
            true
          );
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = originalButtonText;
        }
      });
    })();
  </script>

</body>
</html>
